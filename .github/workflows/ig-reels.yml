name: Instagram Reels
on:
  schedule:
    - cron: '30 6 * * *'
    - cron: '30 9 * * *'
    - cron: '30 12 * * *'
    - cron: '0 16 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Üret ama yayınlama"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: forge-ig_facts
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORGE_LIVE: ${{ vars.FORGE_LIVE }}
      FORGE_DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YT_FUN_CLIENT_ID: ${{ secrets.YT_FUN_CLIENT_ID }}
      YT_FUN_CLIENT_SECRET: ${{ secrets.YT_FUN_CLIENT_SECRET }}
      YT_FUN_REFRESH_TOKEN: ${{ secrets.YT_FUN_REFRESH_TOKEN }}
      YT_DOC_CLIENT_ID: ${{ secrets.YT_DOC_CLIENT_ID }}
      YT_DOC_CLIENT_SECRET: ${{ secrets.YT_DOC_CLIENT_SECRET }}
      YT_DOC_REFRESH_TOKEN: ${{ secrets.YT_DOC_REFRESH_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          render: "true"
      - name: Çalıştır
        run: python -m forge short ig_facts
      - name: Paneli güncelle
        if: always()
        run: python -m forge dashboard
      - name: Önizleme çıktısı (yayın kapalıyken)
        if: ${{ always() && (vars.FORGE_LIVE != '1' || inputs.dry_run == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: onizleme-ig_facts
          path: |
            out/**/final.mp4
            out/**/thumb_*.jpg
          retention-days: 3
          if-no-files-found: ignore
      - name: Durumu kaydet
        if: always()
        run: bash tools/commit_state.sh "ig_facts"
